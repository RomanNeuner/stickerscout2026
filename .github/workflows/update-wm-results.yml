name: Update WM 2026 Results

# WM 2026 ist beendet (Finale 19.07.) — Cron deaktiviert, damit der Job
# die manuell gepflegten KO-Ergebnisse nicht mehr überschreibt.
# (KO-Matching via Kickoff-Zeit schlug fehl → Job publizierte nur Gruppenphase.)
on:
  workflow_dispatch:          # nur noch manuell auslösbar

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Update results
        run: node update-results.js
        working-directory: scripts
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
